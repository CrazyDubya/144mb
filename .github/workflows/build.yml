name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The Windows job builds with ONLY_WIN=1, which skips the harness entirely --
  # so for three releases neither the test bot nor the headless platform layer
  # was ever compiled by CI. The measurement layer could have been deleted and
  # every run would still have gone green. This job compiles them, runs the
  # sanitizers, and plays the game to completion.
  harness:
    name: build harness, sanitize and play
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        shell: bash
        run: |
          set -e
          ver=0.16.0
          url="https://ziglang.org/download/$ver/zig-x86_64-linux-$ver.tar.xz"
          echo "downloading $url"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig && tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo /tmp/zig >> "$GITHUB_PATH"

      - name: Verify Zig
        shell: bash
        run: zig version

      # No ONLY_WIN here: this is the point of the job.
      - name: Build every game with its harness
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for f in */build.sh; do
            d=$(dirname "$f")
            echo "::group::build $d"
            ( cd "$d" && ZIG=zig bash build.sh )
            echo "::endgroup::"
          done

      - name: Sanitizers
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for f in */tools/asan.sh; do
            d=$(dirname "$(dirname "$f")")
            echo "::group::asan $d"
            ( cd "$d" && bash tools/asan.sh )
            echo "::endgroup::"
          done

      # A build that links but cannot finish a run is not a passing build.
      # Every difficulty, so a change that breaks one mode cannot hide.
      - name: Play to completion
        shell: bash
        run: |
          set -e
          cd convoy
          for d in 0 1 2; do
            wins=0
            for s in $(seq 1 20); do
              line=$(./build/convoy_headless -s "$s" -B -e 0 -D "$d" -o /tmp)
              case "$line" in
                *STALLED*) echo "::error::seed $s difficulty $d stalled"; exit 1;;
                *WON*)     wins=$((wins + 1));;
              esac
            done
            echo "difficulty $d: $wins/20 won"
            if [ "$wins" -eq 0 ]; then
              echo "::error::difficulty $d never won in 20 seeds -- the game is unwinnable"
              exit 1
            fi
          done

  windows:
    name: build and smoke-test on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Installed directly rather than via setup-zig: that action resolves
      # tagged releases against ziglang.org/builds, which only carries dev
      # builds and 404s for 0.16.0.
      - name: Install Zig
        shell: pwsh
        run: |
          $ver = "0.16.0"
          $url = "https://ziglang.org/download/$ver/zig-x86_64-windows-$ver.zip"
          $dest = Join-Path $env:RUNNER_TEMP "zig"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\zig.zip" -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter zig.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::zig.exe not found in archive"; exit 1 }
          Write-Host "zig at $($exe.DirectoryName)"
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: Verify Zig
        shell: bash
        run: zig version

      # Games are discovered by looking for build.sh, so adding one needs no
      # change here.
      - name: Build every game
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          found=0
          for f in */build.sh; do
            d=$(dirname "$f")
            echo "::group::build $d"
            ( cd "$d" && ONLY_WIN=1 ZIG=zig bash build.sh )
            echo "::endgroup::"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no games found (expected */build.sh)"
            exit 1
          fi

      # The real point of this workflow: prove the binary actually runs on the
      # platform it targets. A game that renders perfectly in a headless harness
      # can still die on window creation or audio init.
      - name: Smoke-test and screenshot
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Recurse -Filter *.exe |
                  Where-Object { $_.FullName -match '[\\/]build[\\/]' }
          if (-not $exes) { Write-Host "::error::no executables were built"; exit 1 }

          New-Item -ItemType Directory -Force -Path shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $failed = $false

          foreach ($e in $exes) {
            Write-Host "launching $($e.Name)"
            $p = Start-Process -FilePath $e.FullName -PassThru

            # Long enough to open a window, initialise audio and render frames.
            Start-Sleep -Seconds 10

            if ($p.HasExited) {
              Write-Host "::error::$($e.Name) exited early with code $($p.ExitCode)"
              $failed = $true
              continue
            }

            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
            $bmp.Save("shots/$($e.BaseName).png",
                      [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()

            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "$($e.Name) survived 10s and was screenshotted"
          }

          if ($failed) { exit 1 }

      - name: Report sizes
        shell: bash
        run: |
          LIMIT=1474560
          {
            echo "| binary | bytes | % of floppy |"
            echo "|---|---:|---:|"
            find . -path '*/build/*.exe' | while read -r f; do
              b=$(stat -c%s "$f")
              p=$(awk -v b="$b" -v l="$LIMIT" 'BEGIN{printf "%.2f", b*100/l}')
              echo "| $(basename "$f") | $b | ${p}% |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload executables and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            */build/*.exe
            shots/*.png
          if-no-files-found: warn
